# Jamora full stack - Postgres + Strapi CMS + Next.js storefront.
# Admin/CMS:  http://<server>:9014/admin
# Storefront: http://<server>:3095

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-jamora_strapi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5439}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=$${POSTGRES_PASSWORD} psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -c 'select 1' >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  strapi:
    build:
      context: ./jamora-strapi
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      PUBLIC_URL: ${STRAPI_PUBLIC_URL:-http://localhost:9014}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-jamora_strapi}
      DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_POOL_MIN: ${DATABASE_POOL_MIN:-2}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      APP_KEYS: ${STRAPI_APP_KEYS:?set STRAPI_APP_KEYS in .env}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT:?set STRAPI_API_TOKEN_SALT in .env}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET:?set STRAPI_ADMIN_JWT_SECRET in .env}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT:?set STRAPI_TRANSFER_TOKEN_SALT in .env}
      JWT_SECRET: ${STRAPI_JWT_SECRET:?set STRAPI_JWT_SECRET in .env}
      JAMORA_COST_RATIO: ${JAMORA_COST_RATIO:-0.42}
      JAMORA_STOREFRONT_URL: ${JAMORA_STOREFRONT_URL:-http://localhost:3095}
      JAMORA_ADMIN_API_SECRET: ${JAMORA_ADMIN_API_SECRET:-}
      JAMORA_STOREFRONT_API_SECRET: ${JAMORA_STOREFRONT_API_SECRET:-}
      CUSTOMER_ACCOUNTS_ENABLED: ${CUSTOMER_ACCOUNTS_ENABLED:-false}
      CUSTOMER_VERIFICATION_DELIVERY_ENABLED: ${CUSTOMER_VERIFICATION_DELIVERY_ENABLED:-false}
      CUSTOMER_AUTH_RATE_LIMIT: ${CUSTOMER_AUTH_RATE_LIMIT:-8}
      CUSTOMER_AUTH_RATE_WINDOW_MS: ${CUSTOMER_AUTH_RATE_WINDOW_MS:-60000}
      CUSTOMER_AUTH_RATE_MAX_BUCKETS: ${CUSTOMER_AUTH_RATE_MAX_BUCKETS:-10000}
      CUSTOMER_AUTH_HASH_CONCURRENCY: ${CUSTOMER_AUTH_HASH_CONCURRENCY:-4}
      CUSTOMER_AUTH_HASH_QUEUE_LIMIT: ${CUSTOMER_AUTH_HASH_QUEUE_LIMIT:-32}
      STRUCTURED_CHECKOUT_ENABLED: ${STRUCTURED_CHECKOUT_ENABLED:-false}
      MEMBERSHIP_ENABLED: ${MEMBERSHIP_ENABLED:-false}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      PAYMENT_BENEFICIARY_NAME: ${PAYMENT_BENEFICIARY_NAME:-}
      PAYMENT_BENEFICIARY_IBAN: ${PAYMENT_BENEFICIARY_IBAN:-}
      PAYMENT_BENEFICIARY_BANK: ${PAYMENT_BENEFICIARY_BANK:-}
      PAYMENT_TRANSFER_TTL_SECONDS: ${PAYMENT_TRANSFER_TTL_SECONDS:-259200}
      ROPAY_ENABLED: ${ROPAY_ENABLED:-false}
      ROPAY_PROVIDER_MODE: ${ROPAY_PROVIDER_MODE:-mock}
      ROPAY_CALLBACK_SECRET: ${ROPAY_CALLBACK_SECRET:-}
      ROPAY_INTENT_TTL_SECONDS: ${ROPAY_INTENT_TTL_SECONDS:-600}
      ROPAY_RATE_LIMIT: ${ROPAY_RATE_LIMIT:-60}
      ROPAY_RATE_WINDOW_MS: ${ROPAY_RATE_WINDOW_MS:-60000}
      ROPAY_RATE_MAX_BUCKETS: ${ROPAY_RATE_MAX_BUCKETS:-10000}
      ROPAY_AUTH_RATE_LIMIT: ${ROPAY_AUTH_RATE_LIMIT:-10}
      ROPAY_AUTH_REPLAY_LIMIT: ${ROPAY_AUTH_REPLAY_LIMIT:-3}
      ROPAY_AUTH_RATE_WINDOW_MS: ${ROPAY_AUTH_RATE_WINDOW_MS:-60000}
      ROPAY_AUTH_RATE_MAX_BUCKETS: ${ROPAY_AUTH_RATE_MAX_BUCKETS:-10000}
    volumes:
      - strapi_uploads:/app/public/uploads
    ports:
      - "${STRAPI_PORT:-9014}:1337"

  storefront:
    build:
      context: ./jamora-web
    restart: unless-stopped
    depends_on:
      strapi:
        condition: service_healthy
    environment:
      NODE_ENV: production
      STRAPI_URL: http://strapi:1337
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@jamora.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ADMIN_SESSION_TOKEN: ${ADMIN_SESSION_TOKEN:-jamora-admin-dev-session}
      CUSTOMER_SESSION_TOKEN: ${CUSTOMER_SESSION_TOKEN:?set CUSTOMER_SESSION_TOKEN in .env}
      ADMIN_WAREHOUSE_EMAIL: ${ADMIN_WAREHOUSE_EMAIL:-}
      ADMIN_WAREHOUSE_PASSWORD: ${ADMIN_WAREHOUSE_PASSWORD:-}
      ADMIN_CONTENT_EMAIL: ${ADMIN_CONTENT_EMAIL:-}
      ADMIN_CONTENT_PASSWORD: ${ADMIN_CONTENT_PASSWORD:-}
      ADMIN_SUPPORT_EMAIL: ${ADMIN_SUPPORT_EMAIL:-}
      ADMIN_SUPPORT_PASSWORD: ${ADMIN_SUPPORT_PASSWORD:-}
      JAMORA_ADMIN_API_SECRET: ${JAMORA_ADMIN_API_SECRET:-}
      JAMORA_STOREFRONT_API_SECRET: ${JAMORA_STOREFRONT_API_SECRET:-}
      CUSTOMER_ACCOUNTS_ENABLED: ${CUSTOMER_ACCOUNTS_ENABLED:-false}
      CUSTOMER_VERIFICATION_DELIVERY_ENABLED: ${CUSTOMER_VERIFICATION_DELIVERY_ENABLED:-false}
      STRUCTURED_CHECKOUT_ENABLED: ${STRUCTURED_CHECKOUT_ENABLED:-false}
      MEMBERSHIP_ENABLED: ${MEMBERSHIP_ENABLED:-false}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
      ROPAY_ENABLED: ${ROPAY_ENABLED:-false}
    ports:
      - "${STOREFRONT_PORT:-3095}:3000"

volumes:
  pgdata:
  strapi_uploads:
