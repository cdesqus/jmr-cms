upstream jamora_storefront {
    server 192.168.18.204:3095;
}

upstream jamora_strapi {
    server 192.168.18.204:9014;
}

log_format jamora_safe '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent"';
access_log /var/log/nginx/jamora.access.log jamora_safe;

server {
    listen 443 ssl http2;
    server_name jamora.kaumtech.com;

    ssl_certificate     /etc/nginx/ssl/kaumtech.com.pem;
    ssl_certificate_key /etc/nginx/ssl/kaumtech.com.key;

    # Only authenticated provider-to-Strapi callbacks bypass the Next BFF.
    location = /api/jamora/payments/ropay/callback {
        proxy_pass http://jamora_strapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/jamora/internal/payments/ropay/status {
        proxy_pass http://jamora_strapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/jamora/shipping/tracking/webhook {
        proxy_pass http://jamora_strapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads/ {
        proxy_pass http://jamora_strapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next owns all browser routes, including /api/jamora/* and /admin/api/*.
    location / {
        proxy_pass http://jamora_storefront;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl http2;
    server_name cms.jamora.kaumtech.com;

    ssl_certificate     /etc/nginx/ssl/kaumtech.com.pem;
    ssl_certificate_key /etc/nginx/ssl/kaumtech.com.key;

    # Restrict this host further with the operator VPN/private CIDRs.
    location / {
        proxy_pass http://jamora_strapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
