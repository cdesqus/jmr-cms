services:
  db:
    image: postgres:16-alpine
    container_name: mti-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mti_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-matsumoto_erp}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mti} -d ${POSTGRES_DB:-matsumoto_erp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    container_name: mti-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mti}:${POSTGRES_PASSWORD:-mti_dev_pw}@db:5432/${POSTGRES_DB:-matsumoto_erp}
      PORT: 4000
      NODE_ENV: production
      SEED_ON_START: ${SEED_ON_START:-true}
    ports:
      - "${API_PORT:-4000}:4000"

  web:
    build: ./web
    container_name: mti-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  db_data:
